<path d="M1280 370 V500 H870 V430" stroke="#c58a18" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="590" y="500" width="560" height="150" rx="18" fill="#fff8e8" stroke="#e5bd68" stroke-width="2"/><text x="620" y="548" class="h">Independent admin replay</text><text x="620" y="588" class="b">integrity + foreign keys + event chain + reducer + projections</text><text x="620" y="622" class="m">observed: 3 events / head 3 · status verified</text>
<text x="70" y="710" class="s">Captured on v22.23.1 / SQLite 3.53.4; synthetic reserved-domain input is excluded from the artifacts.</text>
