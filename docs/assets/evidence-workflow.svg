<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Reproducible ORTA setup and evidence workflow</title><desc id="desc">Five commands install locked dependencies, verify the native runtime, run the complete gate, generate real evidence assets, and check them for drift.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f66d0"/></marker></defs>
<style>.title{font:700 38px DejaVu Sans,Arial,sans-serif;fill:#172238}.sub{font:20px DejaVu Sans,Arial,sans-serif;fill:#5e6b81}.h{font:700 17px DejaVu Sans,Arial,sans-serif;fill:#172238}.m{font:15px DejaVu Sans Mono,monospace;fill:#234b96}.n{font:700 17px DejaVu Sans,Arial,sans-serif;fill:#234b96}</style>
<rect width="1600" height="500" fill="#f5f7fb"/><text x="70" y="75" class="title">From clean checkout to verified visual evidence</text><text x="70" y="112" class="sub">Every checked-in image is regenerated from the locked runtime and executed process tests.</text><path d="M320 250 H362" stroke="#2f66d0" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="165" width="250" height="170" rx="18" fill="#fff" stroke="#d5ddea" stroke-width="2"/><rect x="92" y="187" width="42" height="42" rx="10" fill="#e8efff"/><text x="113" y="216" text-anchor="middle" class="n">1</text><text x="92" y="265" class="h">LOCKED INSTALL</text><text x="92" y="303" class="m">npm ci</text><path d="M620 250 H662" stroke="#2f66d0" stroke-width="4" marker-end="url(#arrow)"/><rect x="370" y="165" width="250" height="170" rx="18" fill="#fff" stroke="#d5ddea" stroke-width="2"/><rect x="392" y="187" width="42" height="42" rx="10" fill="#e8efff"/><text x="413" y="216" text-anchor="middle" class="n">2</text><text x="392" y="265" class="h">RUNTIME PROOF</text><text x="392" y="303" class="m">npm run runtime:verify</text><path d="M920 250 H962" stroke="#2f66d0" stroke-width="4" marker-end="url(#arrow)"/><rect x="670" y="165" width="250" height="170" rx="18" fill="#fff" stroke="#d5ddea" stroke-width="2"/><rect x="692" y="187" width="42" height="42" rx="10" fill="#e8efff"/><text x="713" y="216" text-anchor="middle" class="n">3</text><text x="692" y="265" class="h">FULL GATE</text><text x="692" y="303" class="m">npm run check</text><path d="M1220 250 H1262" stroke="#2f66d0" stroke-width="4" marker-end="url(#arrow)"/><rect x="970" y="165" width="250" height="170" rx="18" fill="#fff" stroke="#d5ddea" stroke-width="2"/><rect x="992" y="187" width="42" height="42" rx="10" fill="#e8efff"/><text x="1013" y="216" text-anchor="middle" class="n">4</text><text x="992" y="265" class="h">REAL EVIDENCE</text><text x="992" y="303" class="m">npm run evidence:generate</text><rect x="1270" y="165" width="250" height="170" rx="18" fill="#fff" stroke="#d5ddea" stroke-width="2"/><rect x="1292" y="187" width="42" height="42" rx="10" fill="#e8efff"/><text x="1313" y="216" text-anchor="middle" class="n">5</text><text x="1292" y="265" class="h">DRIFT CHECK</text><text x="1292" y="303" class="m">npm run evidence:check</text><text x="70" y="410" class="sub">Generation requires v22.23.1; hosted CI regenerates and byte-compares the committed assets.</text>
</svg>
